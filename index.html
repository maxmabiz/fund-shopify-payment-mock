<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fund · 垫资交易明细 · ShopifyPayments</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #f0f0f0;
      --border-strong: #d9d9d9;
      --text: rgba(0, 0, 0, 0.85);
      --text-secondary: rgba(0, 0, 0, 0.45);
      --primary: #1890ff;
      --primary-hover: #40a9ff;
      --success: #52c41a;
      --danger: #ff4d4f;
      --header-h: 48px;
      --radius: 2px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
    }

    .layout { min-height: 100vh; display: flex; flex-direction: column; }

    .topbar {
      height: var(--header-h);
      background: #001529;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 24px;
    }
    .logo { font-weight: 700; letter-spacing: 0.5px; }
    .top-nav { display: flex; gap: 8px; }
    .top-nav span {
      padding: 6px 12px;
      border-radius: 4px;
      opacity: 0.75;
      cursor: default;
    }
    .top-nav .active { background: var(--primary); opacity: 1; }

    .page { padding: 16px 24px 32px; flex: 1; }

    .breadcrumb {
      color: var(--text-secondary);
      margin-bottom: 12px;
      font-size: 13px;
    }
    .breadcrumb b { color: var(--text); font-weight: 500; }

    .page-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-strong);
      background: transparent;
    }
    .page-tab {
      padding: 10px 16px;
      border: 1px solid var(--border-strong);
      border-bottom: none;
      background: #fafafa;
      border-radius: 4px 4px 0 0;
      margin-right: 4px;
      color: var(--text);
      cursor: default;
    }
    .page-tab.active {
      background: #fff;
      color: var(--primary);
      position: relative;
      z-index: 1;
      margin-bottom: -1px;
      padding-bottom: 11px;
    }

    .card {
      background: var(--card);
      border-radius: 4px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px 24px;
      align-items: end;
    }

    .filter-extra {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px 24px;
      align-items: end;
      margin-top: 0;
      grid-column: 1 / -1;
    }

    .filter-panel.collapsed .filter-extra {
      display: none;
    }

    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label { color: var(--text); font-size: 14px; }
    .field input,
    .field select {
      height: 32px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 4px 11px;
      outline: none;
      background: #fff;
      width: 100%;
      color: var(--text);
    }
    .field input:focus,
    .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2); }
    .field input::placeholder { color: #bfbfbf; }

    .field-actions {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      justify-content: flex-start;
      padding-bottom: 0;
      height: 100%;
    }

    .btn-expand {
      border: none;
      background: transparent;
      color: var(--primary);
      padding: 0 4px;
      height: 32px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
    }
    .btn-expand:hover { color: var(--primary-hover); }

    .btn {
      height: 32px;
      padding: 0 15px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      white-space: nowrap;
    }
    .btn:hover { color: var(--primary); border-color: var(--primary); }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
    .btn-link {
      border: none;
      background: transparent;
      color: var(--text);
      padding: 0 8px;
    }
    .btn-link:hover { color: var(--primary); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .platform-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      flex: 1;
      min-width: 0;
    }
    .platform-tab {
      padding: 12px 16px;
      cursor: pointer;
      color: var(--text);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      user-select: none;
    }
    .platform-tab:hover { color: var(--primary); }
    .platform-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 500;
    }

    .toolbar-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1600px;
    }
    th, td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      font-size: 13px;
    }
    th {
      background: #fafafa;
      color: var(--text);
      font-weight: 500;
      position: sticky;
      top: 0;
    }
    tbody tr:hover { background: #fafafa; }

    .amount-pos { color: var(--success); font-variant-numeric: tabular-nums; }
    .amount-neg { color: var(--danger); font-variant-numeric: tabular-nums; }
    .muted { color: var(--text-secondary); }

    .pagination {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .page-btn {
      min-width: 32px;
      height: 32px;
      border: 1px solid var(--border-strong);
      background: #fff;
      border-radius: var(--radius);
      cursor: default;
    }
    .page-btn.active {
      color: var(--primary);
      border-color: var(--primary);
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 16px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1000;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 1200px) {
      .filter-grid,
      .filter-extra { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

      wrap.querySelectorAll(".platform-tab").forEach((tab) => {

          activePlatform = tab.dataset.platform;
          render();
        });
      });
    }

            <label>交易ID</label>
            <input type="text" placeholder="请输入" />
          </div>
          <div class="field-actions">
            <button class="btn btn-primary" type="button" id="searchBtn">搜索</button>
            <button class="btn" type="button" id="resetBtn">重置</button>
            <button class="btn-expand" type="button" id="expandBtn">展开 ▼</button>
          </div>
          <div class="filter-extra">
            <div class="field">
              <label>交易金额(最小金额)</label>
              <input type="text" placeholder="请输入" />
            </div>
            <div class="field">
              <label>交易金额(最大金额)</label>
              <input type="text" placeholder="请输入" />
            </div>
            <div class="field">
              <label>交易币种</label>
              <select><option value="">请选择</option><option>USD</option><option>EUR</option><option>HKD</option></select>
            </div>
            <div class="field">
              <label>付款方名称</label>
              <input type="text" placeholder="请输入" />
            </div>
            <div class="field">
              <label>付款方账号</label>
              <input type="text" placeholder="请输入" />
            </div>
            <div class="field">
              <label>类型</label>
              <select><option value="">请选择</option></select>
            </div>
            <div class="field">
              <label>二级类型</label>
              <select><option value="">请选择</option></select>
            </div>
          </div>
        `;
      }

      bindFilterActions();
      applyFilterExpandState();
    }

    function formatCell(col, row) {
      const raw = row[col.key] ?? "-";
      if (col.kind === "pos") {
        const n = Number(String(raw).replace(/,/g, ""));
        const cls = n < 0 ? "amount-neg" : "amount-pos";
        return `<span class="${cls}">${raw}</span>`;
      }
      if (col.kind === "neg") {
        const text = String(raw).startsWith("-") ? raw : raw === "0.00" || raw === 0 ? "0.00" : `-${raw}`;
        return `<span class="amount-neg">${text}</span>`;
      }
      return raw === "-" ? `<span class="muted">-</span>` : raw;
    }

    function renderTable() {
      const isShopify = activePlatform === "ShopifyPayments";
      const columns = isShopify ? shopifyColumns : legacyColumns;
      const rows = isShopify ? shopifyMock : legacyMock[activePlatform] || [];

      document.getElementById("tableHead").innerHTML =
        `<tr>${columns.map((c) => `<th>${c.label}</th>`).join("")}</tr>`;

      document.getElementById("tableBody").innerHTML = rows
        .map((row) => `<tr>${columns.map((c) => `<td>${formatCell(c, row)}</td>`).join("")}</tr>`)
        .join("");

      document.getElementById("totalText").textContent = `共 ${rows.length} 条`;
    }

    function render() {
      renderTabs();
      renderFilters();
      renderTable();
    }

    document.getElementById("syncBtn").onclick = () => {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const ts = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      lastSyncMap[activePlatform] = ts;
      toast(`${activePlatform} 流水同步已触发（原型）`);
    };

    document.getElementById("exportBtn").onclick = () => toast(`正在导出 ${activePlatform} 数据（原型）`);
    document.getElementById("lastSyncBtn").onclick = () =>
      toast(`${activePlatform} 最近同步时间：${lastSyncMap[activePlatform]}`);

    render();
  </script>
</body>
</html>
